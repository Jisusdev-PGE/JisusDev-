<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1">
<title>SURGE — JisusDev</title>
<meta name="theme-color" content="#05070f">
<style>
  :root {
    --bg: #05070f;
    --panel: #0e1322;
    --cyan: #3df0ff;
    --pink: #ff4d9e;
    --yellow: #ffe66d;
    --text: #e8eeff;
    --muted: #8b95b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.55rem 0.85rem;
    background: rgba(5,7,15,0.92);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    z-index: 5;
  }
  .bar a {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  .bar a:hover { color: #fff; }
  .brand {
    font-weight: 800;
    letter-spacing: 0.12em;
    font-size: 13px;
    color: var(--cyan);
  }
  .stats {
    display: flex;
    gap: 0.6rem;
    font-size: 12px;
    font-weight: 700;
  }
  .stats span {
    background: rgba(255,255,255,0.06);
    padding: 0.25rem 0.55rem;
    border-radius: 999px;
  }
  #stage {
    flex: 1;
    position: relative;
    display: grid;
    place-items: center;
    min-height: 0;
    background: radial-gradient(ellipse at 50% 30%, #12182c 0%, #05070f 70%);
  }
  canvas {
    display: block;
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,7,15,0.78);
    backdrop-filter: blur(12px);
    z-index: 10;
    padding: 1rem;
  }
  .overlay.hidden { display: none; }
  .card {
    width: min(360px, 100%);
    background: var(--panel);
    border: 1px solid rgba(61,240,255,0.2);
    border-radius: 20px;
    padding: 1.6rem 1.3rem;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,0.55), 0 0 40px rgba(61,240,255,0.08);
  }
  .card h1 {
    font-size: 1.85rem;
    font-weight: 900;
    letter-spacing: 0.14em;
    color: var(--cyan);
    margin-bottom: 0.4rem;
  }
  .card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 1.2rem;
  }
  .btn {
    border: none;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    min-height: 46px;
    padding: 0 1.4rem;
    border-radius: 999px;
    background: var(--cyan);
    color: #05070f;
    transition: transform 0.15s, filter 0.15s;
  }
  .btn:active { transform: scale(0.96); }
  .btn:hover { filter: brightness(1.1); }
  .btn-ghost {
    background: rgba(255,255,255,0.1);
    color: #fff;
    margin-left: 0.4rem;
  }
  .hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--muted);
    background: rgba(0,0,0,0.45);
    padding: 0.35rem 0.8rem;
    border-radius: 999px;
    z-index: 4;
    white-space: nowrap;
  }
  .combo {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    font-size: 28px;
    font-weight: 900;
    color: var(--yellow);
    text-shadow: 0 0 20px rgba(255,230,109,0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    transition: opacity 0.2s, transform 0.2s;
  }
  .combo.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
</style>
</head>
<body>
<div id="wrap">
  <div class="bar">
    <div style="display:flex;gap:0.75rem;align-items:center">
      <a href="./">← Web</a>
      <span class="brand">SURGE</span>
    </div>
    <div class="stats">
      <span id="scoreEl">0</span>
      <span id="bestEl">Best 0</span>
    </div>
  </div>
  <div id="stage">
    <canvas id="c" width="400" height="640"></canvas>
    <div class="combo" id="comboEl">x2</div>
    <div class="hint" id="hint">Toca / barra / ↑ para subir · suelta para caer</div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>SURGE</h1>
    <p>Vuela por el vacío, agarra orbes cyan y evita los bloques. Mientras más lejos llegues, más rápido se pone. Simple y adictivo.</p>
    <button class="btn" id="startBtn">Jugar</button>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div class="card">
    <h1 id="endTitle">Boom</h1>
    <p id="endMsg">Score: 0</p>
    <button class="btn" id="againBtn">Otra</button>
    <a class="btn btn-ghost" href="./">Web</a>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('scoreEl');
  const bestEl = document.getElementById('bestEl');
  const comboEl = document.getElementById('comboEl');
  const menu = document.getElementById('menu');
  const end = document.getElementById('end');

  let best = +localStorage.getItem('surge_best') || 0;
  bestEl.textContent = 'Best ' + best;

  const player = {
    x: W * 0.35,
    y: H * 0.5,
    r: 14,
    vy: 0,
    alive: true
  };

  let walls = [];
  let orbs = [];
  let particles = [];
  let score = 0;
  let combo = 0;
  let comboTimer = 0;
  let speed = 180;
  let dist = 0;
  let running = false;
  let holding = false;
  let lastTime = 0;
  let spawnTimer = 0;
  let shake = 0;

  function reset() {
    player.x = W * 0.32;
    player.y = H * 0.5;
    player.vy = 0;
    player.alive = true;
    walls = [];
    orbs = [];
    particles = [];
    score = 0;
    combo = 0;
    comboTimer = 0;
    speed = 180;
    dist = 0;
    spawnTimer = 0;
    shake = 0;
    scoreEl.textContent = '0';
    for (let i = 0; i < 4; i++) spawnPair(W + i * 160);
  }

  function spawnPair(x) {
    const gap = 130 + Math.random() * 40;
    const topH = 60 + Math.random() * (H - gap - 140);
    walls.push({ x, y: 0, w: 52, h: topH, passed: false });
    walls.push({ x, y: topH + gap, w: 52, h: H - (topH + gap), passed: false });
    if (Math.random() < 0.7) {
      orbs.push({
        x: x + 26,
        y: topH + gap * 0.5,
        r: 8,
        taken: false
      });
    }
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 40 + Math.random() * 120;
      particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.4 + Math.random() * 0.5,
        max: 0.9,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }

  function showCombo() {
    if (combo < 2) return;
    comboEl.textContent = 'x' + combo;
    comboEl.classList.add('show');
    clearTimeout(showCombo._t);
    showCombo._t = setTimeout(() => comboEl.classList.remove('show'), 600);
  }

  function die() {
    if (!player.alive) return;
    player.alive = false;
    running = false;
    burst(player.x, player.y, '#ff4d9e', 28);
    burst(player.x, player.y, '#3df0ff', 12);
    shake = 12;
    if (score > best) {
      best = score;
      localStorage.setItem('surge_best', best);
      bestEl.textContent = 'Best ' + best;
    }
    document.getElementById('endTitle').textContent = score === best && score > 0 ? 'Récord!' : 'Boom';
    document.getElementById('endMsg').textContent = 'Score: ' + score + (combo > 1 ? ' · max combo x' + combo : '');
    setTimeout(() => end.classList.remove('hidden'), 450);
  }

  function update(dt) {
    if (!running || !player.alive) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      if (shake > 0) shake = Math.max(0, shake - dt * 30);
      return;
    }

    const grav = 980;
    const lift = -1400;
    if (holding) player.vy += lift * dt;
    player.vy += grav * dt;
    player.vy = Math.max(-420, Math.min(520, player.vy));
    player.y += player.vy * dt;

    if (player.y - player.r < 0 || player.y + player.r > H) {
      die();
      return;
    }

    speed = 180 + dist * 0.08;
    dist += speed * dt;

    for (let i = walls.length - 1; i >= 0; i--) {
      const w = walls[i];
      w.x -= speed * dt;
      if (circleRect(player.x, player.y, player.r - 2, w.x, w.y, w.w, w.h)) {
        die();
        return;
      }
      if (!w.passed && w.x + w.w < player.x) {
        w.passed = true;
        if (w.y === 0) {
          score += 1;
          scoreEl.textContent = score;
        }
      }
      if (w.x + w.w < -20) walls.splice(i, 1);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const last = walls[walls.length - 1];
      const nx = last ? last.x + 150 + Math.random() * 30 : W + 40;
      spawnPair(nx);
      spawnTimer = 0.55 + Math.random() * 0.25;
      if (score > 15) spawnTimer *= 0.9;
      if (score > 30) spawnTimer *= 0.9;
    }

    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      o.x -= speed * dt;
      if (o.taken) { orbs.splice(i, 1); continue; }
      const d = Math.hypot(o.x - player.x, o.y - player.y);
      if (d < player.r + o.r) {
        o.taken = true;
        combo++;
        comboTimer = 1.8;
        score += 3 * Math.min(combo, 8);
        scoreEl.textContent = score;
        burst(o.x, o.y, '#3df0ff', 14);
        showCombo();
      }
      if (o.x < -20) orbs.splice(i, 1);
    }

    comboTimer -= dt;
    if (comboTimer <= 0) combo = 0;

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 28);
  }

  function circleRect(cx, cy, cr, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    ctx.fillStyle = '#05070f';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    ctx.strokeStyle = 'rgba(61,240,255,0.04)';
    ctx.lineWidth = 1;
    const off = (dist * 0.3) % 40;
    for (let x = -off; x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    for (const w of walls) {
      const g = ctx.createLinearGradient(w.x, 0, w.x + w.w, 0);
      g.addColorStop(0, '#1a2240');
      g.addColorStop(0.5, '#2a3a6a');
      g.addColorStop(1, '#1a2240');
      ctx.fillStyle = g;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = 'rgba(61,240,255,0.35)';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    }

    for (const o of orbs) {
      if (o.taken) continue;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r + 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(61,240,255,0.15)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
      ctx.fillStyle = '#3df0ff';
      ctx.shadowColor = '#3df0ff';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (player.alive || particles.length) {
      const px = player.x, py = player.y;
      ctx.beginPath();
      ctx.arc(px - 8, py, 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(61,240,255,0.2)';
      ctx.fill();

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(Math.atan2(player.vy, speed) * 0.35);
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-10, 11);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-10, -11);
      ctx.closePath();
      ctx.fillStyle = '#3df0ff';
      ctx.shadowColor = '#3df0ff';
      ctx.shadowBlur = 18;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(2, 0, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  function loop(ts) {
    const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0.016);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function startHold(e) {
    if (e && e.preventDefault) e.preventDefault();
    holding = true;
  }
  function endHold(e) {
    if (e && e.preventDefault) e.preventDefault();
    holding = false;
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') {
      e.preventDefault();
      holding = true;
      if (!running && !menu.classList.contains('hidden')) startGame();
    }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === 'w') holding = false;
  });

  canvas.addEventListener('mousedown', startHold);
  window.addEventListener('mouseup', endHold);
  canvas.addEventListener('touchstart', startHold, { passive: false });
  window.addEventListener('touchend', endHold);

  function startGame() {
    reset();
    running = true;
    menu.classList.add('hidden');
    end.classList.add('hidden');
  }

  document.getElementById('startBtn').onclick = startGame;
  document.getElementById('againBtn').onclick = () => {
    end.classList.add('hidden');
    menu.classList.remove('hidden');
  };
})();
</script>
</body>
</html>
